<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1020">
  <meta name="description" content="Official legal information for ReminderFlow by Synvora Labs.">
  <title>ReminderFlow | Legal Center</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% 0%, #22204b 0%, #0c1020 58%);
      color: #f5f6ff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 28px 18px;
    }
    main {
      width: 100%;
      max-width: 600px;
      text-align: center;
    }
    .logo {
      width: 82px;
      height: 82px;
      margin: auto;
      border-radius: 24px;
      display: grid;
      place-items: center;
      font-size: 42px;
      background: linear-gradient(135deg, #7438e7, #187fe4, #24d4ce);
      box-shadow: 0 12px 42px #5725df55;
    }
    h1 { font-size: 36px; margin: 24px 0 8px; }
    .tagline { color: #b9bed6; font-size: 17px; }
    .gradient {
      background: linear-gradient(90deg, #a786ff, #54aaff, #45e3dc);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .section-title {
      margin: 46px 0 18px;
      font-size: 14px;
      letter-spacing: 2px;
      color: #9ea9c8;
      text-transform: uppercase;
    }
    .link-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      text-decoration: none;
      color: #f5f6ff;
      padding: 22px;
      margin-bottom: 14px;
      background: #ffffff0c;
      border: 1px solid #ffffff1b;
      border-radius: 18px;
      transition: background .2s, border-color .2s;
    }
    .link-card:hover {
      background: #ffffff15;
      border-color: #7e73e9;
    }
    .link-card strong { display: block; font-size: 17px; }
    .link-card small {
      display: block;
      margin-top: 7px;
      color: #aab2cc;
      font-size: 13px;
    }
    .arrow { font-size: 25px; color: #66d9ed; }
    footer {
      margin-top: 42px;
      color: #8993af;
      font-size: 13px;
      line-height: 1.9;
    }
    footer a { color: #74d9e8; }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">✓</div>
    <h1>Reminder<span class="gradient">Flow</span></h1>
    <p class="tagline">Never miss what matters.</p>
    <p class="section-title">Legal & Information</p>

    <a class="link-card" href="./terms/index.html">
      <span>
        <strong>Terms & Conditions</strong>
        <small>Rules of use, Premium access and purchases</small>
      </span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>

    <a class="link-card" href="./privacy/index.html">
      <span>
        <strong>Privacy Policy</strong>
        <small>Data storage, permissions and privacy</small>
      </span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>

    <footer>
      <strong>Synvora Labs</strong><br>
      Independent app developer<br>
      Contact:
      <a href="mailto:labsynvora@gmail.com">labsynvora@gmail.com</a>
      <p>© 2026 Synvora Labs. All rights reserved.</p>
    </footer>
  </main>
</body>
</html>
